name: spending-tracker-server-v2

services:
  postgres:
    image: postgres:17-alpine
    container_name: spending-tracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spending_dev}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-spending_test}
      POSTGRES_USER: ${POSTGRES_USER:-spending}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spending}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s

volumes:
  postgres_data:
    name: spending_tracker_postgres_data
